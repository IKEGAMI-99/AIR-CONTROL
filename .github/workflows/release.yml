name: Release APK

on:
  push:
    branches: [main]
    paths:
      - 'release/v0.1.3'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (example: 0.1.3)'
        required: true
        default: '0.1.3'

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.1.3' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore personal signing key
        run: base64 -d ci/aircontrol.keystore.b64 > app/aircontrol.keystore

      - name: Validate signing key
        run: keytool -list -storetype JKS -keystore app/aircontrol.keystore -storepass aircontrol -alias aircontrol >/dev/null

      - name: Calculate monotonic version code
        shell: bash
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
          PATCH="${PATCH%%-*}"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          if [ "$VERSION_CODE" -lt 100 ]; then VERSION_CODE=$((VERSION_CODE + 100)); fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Release versionName=$RELEASE_VERSION versionCode=$VERSION_CODE"

      - name: Build signed release APK
        run: gradle :app:assembleRelease -PVERSION_NAME="$RELEASE_VERSION" -PVERSION_CODE="$VERSION_CODE" --stacktrace

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 5

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "AIR-CONTROL-v${RELEASE_VERSION}.apk"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.RELEASE_VERSION }}
          APK: AIR-CONTROL-v${{ env.RELEASE_VERSION }}.apk
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "AIR CONTROL $TAG" --generate-notes
          fi
